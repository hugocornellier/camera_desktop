name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze

  test-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            libmpv-dev
      - run: cd example && flutter build linux

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd example && flutter build macos

  test-macos-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: cd example && flutter build macos --debug
      - name: Run XCTests
        run: |
          cd example/macos
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -quiet

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Verify /utf-8 is set for MSVC in windows/CMakeLists.txt
        shell: bash
        run: |
          grep -q '/utf-8' windows/CMakeLists.txt \
            || { echo "::error::windows/CMakeLists.txt is missing /utf-8"; exit 1; }

      - name: Verify ci/cp936_repro.cpp covers every non-ASCII char in windows/
        shell: bash
        run: python ci/check_unicode_inventory.py

      - name: Verify ci/cp936_repro.cpp has no UTF-8 BOM
        shell: bash
        run: |
          bom=$(head -c 3 ci/cp936_repro.cpp | od -An -tx1 | tr -d ' \n')
          if [ "$bom" = "efbbbf" ]; then
            echo "::error::ci/cp936_repro.cpp must not have a BOM (MSVC would auto-detect UTF-8 and bypass /source-charset:.936)"
            exit 1
          fi
          echo "OK: no BOM"

      - name: CP936 simulation without /utf-8 must fail with C4819/C2220
        shell: cmd
        run: |
          cl /c /WX /source-charset:.936 /execution-charset:.936 /nologo ci\cp936_repro.cpp > cl.log 2>&1
          set CL_EXIT=%errorlevel%
          type cl.log
          if %CL_EXIT% equ 0 (
            echo ::error::Expected C4819/C2220 but compile succeeded, CP936 simulation is not triggering the bug
            exit /b 1
          )
          findstr /c:"C4819" cl.log >nul
          if errorlevel 1 (
            echo ::error::cl.exe failed but did not emit C4819, test is not reproducing the real bug
            exit /b 1
          )
          findstr /c:"C2220" cl.log >nul
          if errorlevel 1 (
            echo ::error::cl.exe failed but did not emit C2220, /WX promotion is not working as expected
            exit /b 1
          )
          echo OK: CP936 simulation reproduced C4819/C2220 as expected
          exit /b 0

      # Note: MSVC refuses `/source-charset:.936` together with `/utf-8`
      # (error D8016: options are incompatible). On a real Chinese Windows
      # host, CP936 is NOT a flag; it's an implicit default from GetACP().
      # `/utf-8` overrides that implicit default. We prove the fix in two
      # independent invocations: the previous step shows CP936 is hostile
      # to our bytes; this step shows `/utf-8` makes MSVC read them as UTF-8
      # and compile cleanly with /WX. Together they imply that on a real
      # CP936 host, adding `/utf-8` switches MSVC from CP936-mode (fail)
      # to UTF-8-mode (pass).
      - name: Compile with /utf-8 must succeed (proves /utf-8 resolves our chars)
        shell: cmd
        run: cl /c /WX /utf-8 /nologo ci\cp936_repro.cpp

      - name: Build the example (generates the plugin vcxproj)
        run: cd example && flutter build windows

      - name: Verify /utf-8 is threaded into the generated plugin vcxproj
        shell: bash
        run: |
          vcxproj=$(find example/build/windows -name 'camera_desktop_plugin.vcxproj' | head -n1)
          if [ -z "$vcxproj" ]; then
            echo "::error::camera_desktop_plugin.vcxproj not found under example/build/windows"
            find example/build/windows -name '*.vcxproj' || true
            exit 1
          fi
          echo "Inspecting: $vcxproj"
          if ! grep -q '/utf-8' "$vcxproj"; then
            echo "::error::/utf-8 missing from $vcxproj, CMake did not thread the flag through"
            echo "--- vcxproj contents ---"
            cat "$vcxproj"
            exit 1
          fi
          echo "OK: /utf-8 present in $vcxproj"

  # Pure C++ unit tests for the pixel helpers behind the image stream (issue
  # #9): channel order, stride/bottom-up handling, and stream-vs-texture
  # ordering. No Flutter or camera needed.
  test-native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run with ASan/UBSan
        run: |
          for t in linux windows; do
            g++ -std=c++17 -Wall -Wextra -Werror -Wconversion \
              -fsanitize=address,undefined -fno-sanitize-recover=all \
              -I"$t" -Itest/native \
              "test/native/${t}_pixel_utils_test.cc" -o "${t}_pixel_utils_test"
            "./${t}_pixel_utils_test"
          done

  test-native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and run with MSVC
        shell: cmd
        run: |
          cl /nologo /std:c++17 /W4 /WX /EHsc /utf-8 /Iwindows /Itest\native test\native\windows_pixel_utils_test.cc /Fe:windows_pixel_utils_test.exe || exit /b 1
          windows_pixel_utils_test.exe

  # End-to-end image stream check on Linux without real hardware: a
  # v4l2loopback virtual camera is fed a solid red picture, and the example's
  # integration test asserts the streamed bytes are really BGRA (red in byte 2)
  # on both the FFI and MethodChannel paths.
  test-linux-stream-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux dependencies and v4l2loopback
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            libmpv-dev \
            xvfb v4l-utils \
            "linux-headers-$(uname -r)" \
            "linux-modules-extra-$(uname -r)" \
            v4l2loopback-dkms
      - name: Create a virtual camera
        run: |
          sudo modprobe videodev
          sudo modprobe v4l2loopback devices=1 video_nr=10 \
            card_label="CI Red Camera" exclusive_caps=1
          # udev applies its own mode to new device nodes shortly after
          # creation; wait for it, or it would undo the chmod below.
          sudo udevadm settle
          sudo chmod 666 /dev/video10
          ls -l /dev/video*
      - name: Feed it a solid red picture
        run: |
          sudo nohup gst-launch-1.0 -q videotestsrc pattern=red is-live=true \
            ! video/x-raw,format=YUY2,width=640,height=480,framerate=30/1 \
            ! v4l2sink device=/dev/video10 > feeder.log 2>&1 &
          # With exclusive_caps=1 the node only advertises CAPTURE once a
          # producer is streaming, so wait for that before running the test.
          for i in $(seq 1 30); do
            if v4l2-ctl -d /dev/video10 --all 2>/dev/null \
                | grep -q "Video Capture"; then
              break
            fi
            sleep 1
          done
          sudo chmod 666 /dev/video10
          ls -l /dev/video10
          v4l2-ctl -d /dev/video10 --all | head -40
          v4l2-ctl -d /dev/video10 --all | grep -q "Video Capture" \
            || { echo "::error::virtual camera is not producing frames"; cat feeder.log; exit 1; }
      - name: Run the stream format integration test
        run: |
          cd example
          xvfb-run -a flutter test integration_test/image_stream_format_test.dart \
            -d linux --dart-define=EXPECT_RED_CAMERA=true
      - name: Feeder log
        if: always()
        run: cat feeder.log || true

  # End-to-end image stream check on Windows without a webcam: the plugin is
  # built with a test-only fake camera (solid red YUY2 frames, see
  # windows/fake_camera_source.h) that feeds the real Media Foundation capture
  # engine, and the integration test asserts the streamed bytes are really
  # BGRA (red in byte 2) on both the FFI and MethodChannel paths.
  test-windows-stream-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CAMERA_DESKTOP_FAKE_CAMERA: "1"
      CAMERA_DESKTOP_LOG: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Media Foundation diagnostics
        shell: pwsh
        run: |
          (Get-CimInstance Win32_OperatingSystem).Caption
          "mfplat.dll present: " + (Test-Path C:\Windows\System32\mfplat.dll)
          "mfcore.dll present: " + (Test-Path C:\Windows\System32\mfcore.dll)
      - name: Run the stream format integration test
        shell: bash
        run: |
          set -o pipefail
          cd example
          flutter test integration_test/image_stream_format_test.dart \
            -d windows --dart-define=EXPECT_RED_CAMERA=true -v 2>&1 \
            | tee ../e2e.log | grep -E "stream-format-test|tests passed|failed|Error|Exception"
      - name: Plugin and fake camera log
        if: always()
        shell: bash
        run: grep -E "camera_desktop/windows|stream-format-test" e2e.log | tail -120 || true
